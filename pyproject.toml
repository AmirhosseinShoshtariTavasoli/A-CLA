[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-cla"
version = "1.0.0"
description = "Reference and archival implementation for Adaptive Cellular Learning Automata community detection"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Amirhossein Fathinavid"},
  {name = "Amirhossein Shoshtari Tavasoli"}
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "networkx>=3.0",
  "openpyxl>=3.1",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "statsmodels>=0.14"
]

[project.optional-dependencies]
full = [
  "python-louvain>=0.16",
  "python-igraph>=0.11",
  "leidenalg>=0.10",
  "cdlib>=0.4"
]
test = ["pytest>=8"]

[project.scripts]
a-cla = "acla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
